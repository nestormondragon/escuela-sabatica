<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- AppLayout keeps this synchronized after mount. The inline bootstrap
         applies the saved preference before CSS paints, preventing a theme or
         text-size flash while JourneyState initializes. -->
    <meta name="theme-color" content="#0d0f12" />
    <script>
      (() => {
        const root = document.documentElement;
        let theme = "dark";
        let textSize = "normal";
        let reducedMotion = "system";
        try {
          const raw = localStorage.getItem("escuela:journey:2026-Q3");
          const legacyRaw = raw ? null : localStorage.getItem("escuela:settings");
          const settings = raw
            ? JSON.parse(raw)?.settings
            : legacyRaw
              ? JSON.parse(legacyRaw)
              : null;
          const legacyTheme =
            settings?.mode === "day"
              ? "light"
              : settings?.mode === "night"
                ? "dark"
                : null;
          theme = ["auto", "light", "dark"].includes(settings?.theme)
            ? settings.theme
            : legacyTheme || theme;
          textSize = ["normal", "large", "x-large"].includes(settings?.textSize)
            ? settings.textSize
            : textSize;
          reducedMotion =
            settings?.reducedMotion === true ? "reduce" : "system";
        } catch {
          // Storage may be unavailable or malformed; canonical defaults remain.
        }
        const light =
          theme === "light" ||
          (theme === "auto" &&
            matchMedia("(prefers-color-scheme: light)").matches);
        root.dataset.mode = light ? "day" : "night";
        root.dataset.textSize = textSize;
        root.dataset.motion = reducedMotion;
        root.style.colorScheme = light ? "light" : "dark";
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", light ? "#d5d5d1" : "#0d0f12");
      })();
    </script>

    <!-- Static fallback. App.jsx replaces this with the live lesson so a
         bookmark or an open tab says which week the reader is on. -->
    <title>Escuela Sabática · 1 y 2 Corintios</title>
    <meta name="description" content="Una experiencia personal de la Escuela Sabática sobre 1 y 2 Corintios: cada respuesta restaura una pieza de tu Corinto. La app abre la lección de esta semana automáticamente." />

    <meta property="og:title" content="Escuela Sabática · 1 y 2 Corintios" />
    <meta property="og:description" content="Un atrio de piedra, barro y luz que cambia con cada respuesta." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <!-- summary, not summary_large_image: there is no og:image asset to point at -->
    <meta name="twitter:card" content="summary" />

    <!-- Four tesserae in clay, matching the quarter's mark in the topbar.
         Kept to four shapes so it survives being drawn at 16px. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='8' height='8' rx='1' fill='%23df7554'/%3E%3Crect x='13' y='3' width='8' height='8' rx='1' fill='%23b94d34'/%3E%3Crect x='3' y='13' width='8' height='8' rx='1' fill='%23b94d34'/%3E%3Crect x='13' y='13' width='8' height='8' rx='1' fill='%23df7554'/%3E%3C/svg%3E" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
